<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c5cd0"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="458" height="188" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="230" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">CQRS: Separated Models</text>

  <!-- Command Model (blue) -->
  <rect x="34" y="44" width="135" height="52" rx="6" fill="#eef4ff" stroke="#3b6fb0" stroke-width="2"/>
  <text x="101" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3a5f">Command Model</text>
  <text x="101" y="85" text-anchor="middle" font-size="11" fill="#3b6fb0">(writes)</text>

  <!-- Query Model (amber) -->
  <rect x="291" y="44" width="135" height="52" rx="6" fill="#fdf2e3" stroke="#b07d2e" stroke-width="2"/>
  <text x="358" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a531a">Query Model</text>
  <text x="358" y="85" text-anchor="middle" font-size="11" fill="#b07d2e">(reads)</text>

  <!-- Arrows down -->
  <line x1="101" y1="96" x2="101" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="358" y1="122" x2="358" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event Store (purple) -->
  <rect x="34" y="126" width="135" height="52" rx="6" fill="#ede9fe" stroke="#7c5cd0" stroke-width="2"/>
  <text x="101" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Event Store</text>
  <text x="101" y="167" text-anchor="middle" font-size="11" fill="#6d28d9">(reckon-db)</text>

  <!-- Read Models (green) -->
  <rect x="291" y="126" width="135" height="52" rx="6" fill="#eef7ef" stroke="#3a8a4f" stroke-width="2"/>
  <text x="358" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4d2c">Read Models</text>
  <text x="358" y="167" text-anchor="middle" font-size="11" fill="#3a8a4f">(projections)</text>

  <!-- Events flow arrow -->
  <line x1="169" y1="152" x2="286" y2="152" stroke="#7c5cd0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowP)"/>
  <text x="227" y="145" text-anchor="middle" font-size="11" fill="#6d28d9">events</text>
</svg>
