<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="d-arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#2f8f4e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="558" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="440" y="48" text-anchor="middle" fill="#1e293b" font-size="32" font-weight="bold">The Dossier Metaphor</text>
  <text x="440" y="78" text-anchor="middle" fill="#64748b" font-size="19">The aggregate IS its accumulated history; read the stream front to back.</text>

  <!-- Stream label -->
  <text x="440" y="112" text-anchor="middle" fill="#2f8f4e" font-family="monospace" font-size="21" font-weight="bold">stream: loan-application-2024-0042</text>

  <!-- ===== Three desks ===== -->
  <!-- Desk 1: Intake -->
  <rect x="32" y="132" width="246" height="150" rx="8" fill="#eef4ff" stroke="#3b6fb0" stroke-width="2"/>
  <rect x="44" y="144" width="222" height="30" rx="5" fill="#3b6fb0"/>
  <text x="155" y="165" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">DESK 1 · Intake</text>
  <text x="155" y="198" text-anchor="middle" fill="#1e293b" font-family="monospace" font-size="17">application_submitted_v1</text>
  <text x="155" y="226" text-anchor="middle" fill="#94a3b8" font-size="15">Dossier gains:</text>
  <text x="155" y="250" text-anchor="middle" fill="#1d3a5f" font-family="monospace" font-size="18">applicant_name</text>
  <text x="155" y="272" text-anchor="middle" fill="#1d3a5f" font-family="monospace" font-size="18">requested_amount</text>

  <line x1="280" y1="207" x2="314" y2="207" stroke="#2f8f4e" stroke-width="2.5" marker-end="url(#d-arrow)"/>

  <!-- Desk 2: Credit -->
  <rect x="317" y="132" width="246" height="150" rx="8" fill="#eef7ef" stroke="#3a8a4f" stroke-width="2"/>
  <rect x="329" y="144" width="222" height="30" rx="5" fill="#3a8a4f"/>
  <text x="440" y="165" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">DESK 2 · Credit</text>
  <text x="440" y="198" text-anchor="middle" fill="#1e293b" font-family="monospace" font-size="17">credit_score_retrieved_v1</text>
  <text x="440" y="226" text-anchor="middle" fill="#94a3b8" font-size="15">Dossier gains:</text>
  <text x="440" y="250" text-anchor="middle" fill="#1f4d2c" font-family="monospace" font-size="18">credit_score: 720</text>
  <text x="440" y="272" text-anchor="middle" fill="#1f4d2c" font-family="monospace" font-size="18">debt_to_income: 28%</text>

  <line x1="565" y1="207" x2="599" y2="207" stroke="#2f8f4e" stroke-width="2.5" marker-end="url(#d-arrow)"/>

  <!-- Desk 3: Underwrite -->
  <rect x="602" y="132" width="246" height="150" rx="8" fill="#fdf2e3" stroke="#b07d2e" stroke-width="2"/>
  <rect x="614" y="144" width="222" height="30" rx="5" fill="#b07d2e"/>
  <text x="725" y="165" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">DESK 3 · Underwrite</text>
  <text x="725" y="198" text-anchor="middle" fill="#1e293b" font-family="monospace" font-size="17">underwriting_decided_v1</text>
  <text x="725" y="226" text-anchor="middle" fill="#94a3b8" font-size="15">Dossier gains:</text>
  <text x="725" y="250" text-anchor="middle" fill="#7a531a" font-family="monospace" font-size="18">decision: APPROVED</text>
  <text x="725" y="272" text-anchor="middle" fill="#7a531a" font-family="monospace" font-size="18">underwriter_id</text>

  <!-- ===== The accumulated dossier ===== -->
  <rect x="32" y="306" width="816" height="118" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="334" text-anchor="middle" fill="#334155" font-size="20" font-weight="bold">THE DOSSIER  =  the stream, folded to state at any point</text>
  <text x="135" y="372" text-anchor="middle" fill="#1e293b" font-family="monospace" font-size="18">applicant: "Alice"</text>
  <text x="135" y="400" text-anchor="middle" fill="#1e293b" font-family="monospace" font-size="18">amount: $150,000</text>
  <text x="385" y="372" text-anchor="middle" fill="#1e293b" font-family="monospace" font-size="18">credit_score: 720</text>
  <text x="385" y="400" text-anchor="middle" fill="#1e293b" font-family="monospace" font-size="18">debt_to_income: 28%</text>
  <text x="660" y="372" text-anchor="middle" fill="#1f4d2c" font-family="monospace" font-size="18">decision: APPROVED</text>
  <text x="660" y="400" text-anchor="middle" fill="#1f4d2c" font-family="monospace" font-size="18">disbursed: $150,000</text>

  <!-- ===== Key insight ===== -->
  <rect x="32" y="442" width="816" height="100" rx="8" fill="#eef7ef" stroke="#3a8a4f" stroke-width="1.5"/>
  <text x="440" y="470" text-anchor="middle" fill="#1f4d2c" font-size="20" font-weight="bold">Key insight: temporal auditability</text>
  <text x="440" y="498" text-anchor="middle" fill="#334155" font-size="17">Replay to event 3 and you see exactly what the underwriter saw: credit_score 720,</text>
  <text x="440" y="522" text-anchor="middle" fill="#334155" font-size="17">debt_to_income 28%. The Dossier records all the context available at each decision.</text>
</svg>
