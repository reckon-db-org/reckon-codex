<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arw-green" viewBox="0 0 12 8" refX="11" refY="4" markerWidth="11" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,4 L0,8 z" fill="#2f8f4e"/>
    </marker>
    <marker id="arw-amber" viewBox="0 0 12 8" refX="11" refY="4" markerWidth="11" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,4 L0,8 z" fill="#cf8a1e"/>
    </marker>
    <marker id="arw-slate" viewBox="0 0 12 8" refX="11" refY="4" markerWidth="11" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="998" height="768" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="500" y="52" fill="#1e293b" font-size="34" font-weight="bold" text-anchor="middle">The Reckon Cycle</text>
  <text x="500" y="86" fill="#64748b" font-size="21" text-anchor="middle">A Division's lifecycle is two processes: Planning and Crafting. The wheel turns until it ships.</text>

  <!-- ============ DOMAIN CHARTER band (top) ============ -->
  <rect x="130" y="108" width="740" height="96" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="140" fill="#334155" font-size="25" font-weight="bold" text-anchor="middle">DOMAIN CHARTER</text>
  <text x="500" y="166" fill="#64748b" font-size="19" text-anchor="middle">a Domain scope, not a Division lifecycle phase</text>
  <text x="500" y="193" fill="#1e293b" font-size="23" text-anchor="middle">setup_venture&#160;&#160;&#160;&#183;&#160;&#160;&#160;discover_divisions</text>

  <!-- charter -> wheel (into Planning) -->
  <path d="M360,204 Q300,250 300,318" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arw-slate)"/>
  <text x="318" y="262" fill="#475569" font-size="21" text-anchor="start">&#8594; initiate_planning</text>

  <!-- ============ THE WHEEL (middle) ============ -->
  <ellipse cx="500" cy="400" rx="385" ry="118" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,6"/>

  <!-- PLANNING node -->
  <rect x="150" y="330" width="300" height="140" rx="12" fill="#eef4ff" stroke="#3b6fb0" stroke-width="2.5"/>
  <text x="300" y="386" fill="#1d3a5f" font-size="32" font-weight="bold" text-anchor="middle">PLANNING</text>
  <text x="300" y="416" fill="#3b6fb0" font-size="22" text-anchor="middle">design &#183; aggregates &#183; desks</text>
  <text x="300" y="446" fill="#7c93ad" font-size="19" text-anchor="middle">guide_division_planning</text>

  <!-- CRAFTING node -->
  <rect x="550" y="330" width="300" height="140" rx="12" fill="#eef7ef" stroke="#3a8a4f" stroke-width="2.5"/>
  <text x="700" y="386" fill="#1f4d2c" font-size="32" font-weight="bold" text-anchor="middle">CRAFTING</text>
  <text x="700" y="416" fill="#3a8a4f" font-size="22" text-anchor="middle">generate &#183; test &#183; deliver</text>
  <text x="700" y="446" fill="#7ba488" font-size="19" text-anchor="middle">guide_division_crafting</text>

  <!-- forward arrow Planning -> Crafting -->
  <line x1="452" y1="380" x2="548" y2="380" stroke="#2f8f4e" stroke-width="3" marker-end="url(#arw-green)"/>
  <text x="500" y="368" fill="#2f8f4e" font-size="22" font-weight="bold" text-anchor="middle">conclude &#8594; initiate</text>

  <!-- back arrow Crafting -> Planning (re-open) -->
  <path d="M560,452 Q500,532 440,452" fill="none" stroke="#cf8a1e" stroke-width="3" stroke-dasharray="9,5" marker-end="url(#arw-amber)"/>
  <text x="500" y="528" fill="#b9791a" font-size="22" font-weight="bold" text-anchor="middle">late discovery re-opens the plan</text>

  <!-- ============ CONTINUOUS OPERATIONS band (bottom) ============ -->
  <rect x="130" y="572" width="740" height="98" rx="9" fill="#f7f3ea" stroke="#b08a3e" stroke-width="1.5"/>
  <text x="500" y="604" fill="#6b531c" font-size="25" font-weight="bold" text-anchor="middle">CONTINUOUS OPERATIONS</text>
  <text x="500" y="630" fill="#8a7330" font-size="19" text-anchor="middle">a Node scope: runs for the Division's whole life, not lifecycle phases</text>
  <text x="500" y="658" fill="#4a3a12" font-size="23" text-anchor="middle">monitoring&#160;&#160;&#160;&#183;&#160;&#160;&#160;rescue&#160;&#160;&#160;&#183;&#160;&#160;&#160;refactoring</text>

  <!-- ops -> wheel (re-open Crafting) -->
  <path d="M700,572 Q720,530 712,472" fill="none" stroke="#cf8a1e" stroke-width="2" stroke-dasharray="9,5" marker-end="url(#arw-amber)"/>
  <text x="742" y="540" fill="#8a7330" font-size="20" text-anchor="start">postmortem</text>
  <text x="742" y="562" fill="#8a7330" font-size="20" text-anchor="start">re-opens Crafting</text>

  <!-- ============ lifecycle legend ============ -->
  <text x="500" y="722" fill="#475569" font-size="22" text-anchor="middle">process lifecycle:&#160;&#160;initiate &#8594; open &#8644; shelve / resume &#8594; conclude &#8594; archive</text>

  <!-- footer credit -->
  <text x="868" y="758" fill="#cbd5e1" font-size="14" text-anchor="end">The Reckon Codex &#183; &#167;7</text>
</svg>
