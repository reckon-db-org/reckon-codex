<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="system-ui, sans-serif">
  <defs>
    <radialGradient id="hub" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#fefcf8"/>

  <!-- Title -->
  <text x="450" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1e1b4b">Pizza Architecture</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">Inverted, sliced: three Department rings around an Event Store, cut by Desks</text>

  <!-- Outer crust: infrastructure boundary -->
  <circle cx="450" cy="400" r="285" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- QRY ring (outer Department) -->
  <circle cx="450" cy="400" r="245" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- PRJ ring (middle Department) -->
  <circle cx="450" cy="400" r="195" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>

  <!-- CMD ring (inner Department) -->
  <circle cx="450" cy="400" r="140" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>

  <!-- Wedge dividers: 8 radial dashed lines through every ring -->
  <g stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.55">
    <line x1="450" y1="115" x2="450" y2="685" transform="rotate(22.5 450 400)"/>
    <line x1="450" y1="115" x2="450" y2="685" transform="rotate(67.5 450 400)"/>
    <line x1="450" y1="115" x2="450" y2="685" transform="rotate(112.5 450 400)"/>
    <line x1="450" y1="115" x2="450" y2="685" transform="rotate(157.5 450 400)"/>
  </g>

  <!-- Ring labels (placed at top of each ring on the centre vertical) -->
  <text x="450" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e" letter-spacing="2.5">CRUST · INFRASTRUCTURE</text>
  <text x="450" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" letter-spacing="4">QRY</text>
  <text x="450" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" letter-spacing="4">PRJ</text>
  <text x="450" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#831843" letter-spacing="4">CMD</text>

  <!-- Hub: event store -->
  <circle cx="450" cy="400" r="80" fill="url(#hub)" stroke="#312e81" stroke-width="2" filter="url(#soft)"/>
  <text x="450" y="394" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">EVENT</text>
  <text x="450" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">STORE</text>

  <!-- Desk labels around the wedges (positioned in QRY ring, radius ~265) -->
  <g font-size="11.5" fill="#0f172a" text-anchor="middle" font-family="monospace">
    <!-- Wedge centres at every 45° around the wheel. Wedge 1 = north -->
    <text x="611" y="240">return_loan</text>
    <text x="681" y="404">renew_loan</text>
    <text x="611" y="566">flag_overdue</text>
    <text x="450" y="635">reserve_isbn</text>
    <text x="289" y="566">open_membership</text>
    <text x="219" y="404">register_book</text>
    <text x="289" y="240">retire_book</text>
    <text x="450" y="338" fill="#1e1b4b" font-weight="700">issue_loan</text>
  </g>

  <!-- Side legend -->
  <g transform="translate(720, 145)">
    <rect x="-5" y="-15" width="175" height="245" fill="#fafaf9" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="0" y="0" font-size="12" font-weight="700" fill="#1e1b4b">Key Principles</text>
    <text x="0" y="22" font-size="11" fill="#334155">• Hub: Event Store</text>
    <text x="0" y="40" font-size="11" fill="#334155">• Rings: CMD / PRJ / QRY</text>
    <text x="0" y="58" font-size="11" fill="#334155">• Wedges: Desks (slices)</text>
    <text x="0" y="76" font-size="11" fill="#334155">• Crust: infrastructure</text>
    <text x="0" y="94" font-size="11" fill="#334155">• Inversion: deps inward</text>
    <text x="0" y="112" font-size="11" fill="#334155">• Slicing: by capability</text>
    <text x="0" y="138" font-size="12" font-weight="700" fill="#1e1b4b">Flow direction</text>
    <text x="0" y="160" font-size="11" fill="#334155">CMD writes → store</text>
    <text x="0" y="178" font-size="11" fill="#334155">PRJ reads ← store</text>
    <text x="0" y="196" font-size="11" fill="#334155">QRY serves ← PRJ</text>
    <text x="0" y="220" font-size="10.5" fill="#475569" font-style="italic">Each slice spans all three.</text>
  </g>

  <!-- Footer signature -->
  <text x="870" y="710" text-anchor="end" font-size="9" fill="#94a3b8">The Reckon Codex · Pizza Architecture</text>
</svg>
