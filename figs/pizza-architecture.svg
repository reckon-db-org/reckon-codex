<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="hub" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="pubsub" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="998" height="718" fill="#fefcf8" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="500" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1e1b4b">Pizza Architecture: the Lending Division in cross-section</text>
  <text x="500" y="74" text-anchor="middle" font-size="17" fill="#64748b">Hub (Event Store) + spokes (Desks, each with its actors) + Pub/Sub ring + external infrastructure</text>

  <!-- ====== external infrastructure boxes ====== -->
  <g font-size="15" fill="#475569" text-anchor="middle">
    <rect x="34" y="220" width="92" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="80" y="246">storage</text>
    <rect x="34" y="372" width="92" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="80" y="398">telemetry</text>
    <rect x="34" y="524" width="92" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="80" y="550">hardware</text>
    <rect x="874" y="220" width="92" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="920" y="246">messaging</text>
    <rect x="874" y="372" width="92" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="920" y="398">internet</text>
    <rect x="874" y="524" width="92" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="920" y="550">event stream</text>
  </g>

  <!-- ====== outer ring: Pub/Sub Infrastructure ====== -->
  <circle cx="500" cy="380" r="288" fill="url(#pubsub)" stroke="#3b82f6" stroke-width="3"/>
  <text x="500" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a" letter-spacing="2">PUB / SUB INFRASTRUCTURE</text>

  <!-- ====== 8 spokes (all Lending Desks) ====== -->
  <!-- Each spoke = one slice (Desk). Four colour-coded actor types stacked outward. -->
  <g>
    <g transform="rotate(0 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="500" y="140" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">issue_loan</text>

    <g transform="rotate(45 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="676" y="208" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">return_loan</text>

    <g transform="rotate(90 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="770" y="385" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">renew_loan</text>

    <g transform="rotate(135 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="676" y="566" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">flag_overdue</text>

    <g transform="rotate(180 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="500" y="638" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">waive_late_fee</text>

    <g transform="rotate(225 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="318" y="566" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">pay_late_fee</text>

    <g transform="rotate(270 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="230" y="385" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">place_hold</text>

    <g transform="rotate(315 500 380)">
      <rect x="476" y="150" width="48" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8" rx="2"/>
      <rect x="476" y="174" width="48" height="22" fill="#86efac" stroke="#166534" stroke-width="0.8" rx="2"/>
      <rect x="476" y="198" width="48" height="22" fill="#fde68a" stroke="#92400e" stroke-width="0.8" rx="2"/>
      <rect x="476" y="222" width="48" height="22" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8" rx="2"/>
    </g>
    <text x="318" y="208" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#0f172a">track_book</text>
  </g>

  <!-- ====== Hub: Event Store ====== -->
  <circle cx="500" cy="380" r="78" fill="url(#hub)" stroke="#312e81" stroke-width="2"/>
  <text x="500" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">EVENT</text>
  <text x="500" y="394" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">STORE</text>
  <text x="500" y="414" text-anchor="middle" font-size="13" fill="#ddd6fe">(the hub)</text>

  <!-- ====== Actor legend ====== -->
  <g transform="translate(694, 590)">
    <rect x="-12" y="-22" width="296" height="138" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="0" y="0" font-size="16" font-weight="700" fill="#1e1b4b">Per-spoke actors</text>
    <rect x="0" y="12" width="18" height="18" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.8"/>
    <text x="26" y="26" font-size="15" fill="#334155">Emitter (publishes facts)</text>
    <rect x="0" y="36" width="18" height="18" fill="#86efac" stroke="#166534" stroke-width="0.8"/>
    <text x="26" y="50" font-size="15" fill="#334155">Listener (consumes facts)</text>
    <rect x="0" y="60" width="18" height="18" fill="#fde68a" stroke="#92400e" stroke-width="0.8"/>
    <text x="26" y="74" font-size="15" fill="#334155">Responder (hope in)</text>
    <rect x="0" y="84" width="18" height="18" fill="#fca5a5" stroke="#991b1b" stroke-width="0.8"/>
    <text x="26" y="98" font-size="15" fill="#334155">Requester (hope out)</text>
  </g>

  <!-- ====== Footer ====== -->
  <text x="500" y="700" text-anchor="middle" font-size="15" fill="#94a3b8" font-style="italic">A spoke is a slice. A slice is a Desk.</text>
</svg>
