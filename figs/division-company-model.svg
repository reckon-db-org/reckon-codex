<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrowSlate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b6fb0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3a8a4f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="998" height="698" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#1e293b" font-size="26" font-weight="bold">A Division as Three Sibling Departments</text>
  <text x="500" y="64" text-anchor="middle" fill="#64748b" font-size="16">the manage_loans Division (lending-library example)</text>

  <!-- Division border -->
  <rect x="30" y="78" width="940" height="566" rx="12" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="102" fill="#334155" font-size="16" font-weight="600">LENDING DIVISION</text>

  <!-- ===================== CMD Department ===================== -->
  <rect x="50" y="116" width="290" height="514" rx="8" fill="#eef4ff" stroke="#3b6fb0" stroke-width="2"/>
  <text x="195" y="140" text-anchor="middle" fill="#1d3a5f" font-size="17" font-weight="bold">CMD Department</text>
  <text x="195" y="158" text-anchor="middle" fill="#64748b" font-size="13">(Processing)</text>

  <rect x="65" y="170" width="260" height="128" rx="6" fill="#f7faff" stroke="#9db8dd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="195" y="190" text-anchor="middle" fill="#3b6fb0" font-size="13" font-weight="600">FRONTDESKS</text>

  <rect x="80" y="202" width="105" height="82" rx="4" fill="#dbe6f7" stroke="#3b6fb0" stroke-width="1"/>
  <text x="132" y="226" text-anchor="middle" fill="#1d3a5f" font-size="13" font-weight="500">gRPC Inbox</text>
  <text x="132" y="244" text-anchor="middle" fill="#5a7596" font-size="11">Responder</text>
  <text x="132" y="270" text-anchor="middle" fill="#7c93ad" font-size="11">hope in</text>

  <rect x="200" y="202" width="110" height="82" rx="4" fill="#dbe6f7" stroke="#3b6fb0" stroke-width="1"/>
  <text x="255" y="226" text-anchor="middle" fill="#1d3a5f" font-size="13" font-weight="500">Fact Sub</text>
  <text x="255" y="244" text-anchor="middle" fill="#5a7596" font-size="11">Listener</text>
  <text x="255" y="270" text-anchor="middle" fill="#7c93ad" font-size="11">facts in</text>

  <rect x="65" y="312" width="260" height="304" rx="6" fill="#f7faff" stroke="#9db8dd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="195" y="332" text-anchor="middle" fill="#3b6fb0" font-size="13" font-weight="600">BACKOFFICE DESKS</text>

  <rect x="80" y="346" width="230" height="118" rx="4" fill="#dbe6f7" stroke="#3b6fb0" stroke-width="1"/>
  <text x="195" y="367" text-anchor="middle" fill="#1d3a5f" font-size="13" font-weight="600">issue_loan desk</text>
  <rect x="90" y="376" width="100" height="36" rx="3" fill="#c3d7f0" stroke="#3b6fb0" stroke-width="1"/>
  <text x="140" y="399" text-anchor="middle" fill="#1d3a5f" font-size="11">Command Inbox</text>
  <rect x="200" y="376" width="100" height="36" rx="3" fill="#c3d7f0" stroke="#3b6fb0" stroke-width="1"/>
  <text x="250" y="392" text-anchor="middle" fill="#1d3a5f" font-size="11">Listener Inbox</text>
  <text x="250" y="406" text-anchor="middle" fill="#5a7596" font-size="10">on_book_loanable</text>
  <rect x="90" y="420" width="210" height="36" rx="3" fill="#ede9fe" stroke="#7c5cd0" stroke-width="1"/>
  <text x="195" y="436" text-anchor="middle" fill="#4c1d95" font-size="11" font-weight="500">Event: loan_issued_v1</text>
  <text x="195" y="450" text-anchor="middle" fill="#6d28d9" font-size="10">to PRJ Department</text>

  <rect x="80" y="474" width="230" height="50" rx="4" fill="#f7faff" stroke="#9db8dd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="195" y="496" text-anchor="middle" fill="#5a7596" font-size="12">renew_loan desk</text>
  <text x="195" y="514" text-anchor="middle" fill="#5a7596" font-size="12">return_loan desk ...</text>

  <!-- ===================== PRJ Department ===================== -->
  <rect x="355" y="116" width="290" height="514" rx="8" fill="#eef7ef" stroke="#3a8a4f" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" fill="#1f4d2c" font-size="17" font-weight="bold">PRJ Department</text>
  <text x="500" y="158" text-anchor="middle" fill="#64748b" font-size="13">(Filing)</text>

  <rect x="370" y="170" width="260" height="74" rx="6" fill="#f3fbf5" stroke="#8fc7a3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="500" y="190" text-anchor="middle" fill="#3a8a4f" font-size="13" font-weight="600">FRONTDESK</text>
  <rect x="385" y="202" width="230" height="34" rx="4" fill="#d7eede" stroke="#3a8a4f" stroke-width="1"/>
  <text x="500" y="224" text-anchor="middle" fill="#1f4d2c" font-size="12">Event Subscription Router</text>

  <rect x="370" y="258" width="260" height="358" rx="6" fill="#f3fbf5" stroke="#8fc7a3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="500" y="278" text-anchor="middle" fill="#3a8a4f" font-size="13" font-weight="600">BACKOFFICE FILERS</text>

  <rect x="385" y="292" width="230" height="84" rx="4" fill="#d7eede" stroke="#3a8a4f" stroke-width="1"/>
  <text x="500" y="313" text-anchor="middle" fill="#1f4d2c" font-size="13" font-weight="500">loan_issued_to_loans</text>
  <rect x="395" y="322" width="210" height="46" rx="3" fill="#c2e6cf" stroke="#3a8a4f" stroke-width="1"/>
  <text x="500" y="342" text-anchor="middle" fill="#1f4d2c" font-size="11">writes: loans table</text>
  <text x="500" y="358" text-anchor="middle" fill="#5a8a6c" font-size="10">(local read model)</text>

  <rect x="385" y="388" width="230" height="84" rx="4" fill="#fdf2e3" stroke="#b07d2e" stroke-width="1.5"/>
  <text x="500" y="409" text-anchor="middle" fill="#7a531a" font-size="13" font-weight="500">loan_issued_to_mesh</text>
  <rect x="395" y="418" width="210" height="46" rx="3" fill="#f6e2c2" stroke="#b07d2e" stroke-width="1"/>
  <text x="500" y="438" text-anchor="middle" fill="#7a531a" font-size="11">publishes: MESH FACT</text>
  <text x="500" y="454" text-anchor="middle" fill="#9a7330" font-size="10">(integration fact, renamed)</text>

  <rect x="385" y="484" width="230" height="58" rx="4" fill="#d7eede" stroke="#3a8a4f" stroke-width="1"/>
  <text x="500" y="505" text-anchor="middle" fill="#1f4d2c" font-size="13" font-weight="500">loan_flagged_to_overdue</text>
  <text x="500" y="525" text-anchor="middle" fill="#5a8a6c" font-size="10">writes: overdue index</text>

  <rect x="385" y="554" width="230" height="46" rx="4" fill="#f3fbf5" stroke="#8fc7a3" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="500" y="581" text-anchor="middle" fill="#5a8a6c" font-size="12">cache_filer, analytics_filer ...</text>

  <!-- ===================== QRY Department ===================== -->
  <rect x="660" y="116" width="290" height="514" rx="8" fill="#fdf2e3" stroke="#b07d2e" stroke-width="2"/>
  <text x="805" y="140" text-anchor="middle" fill="#7a531a" font-size="17" font-weight="bold">QRY Department</text>
  <text x="805" y="158" text-anchor="middle" fill="#64748b" font-size="13">(Inquiries)</text>

  <rect x="675" y="170" width="260" height="74" rx="6" fill="#fef8ee" stroke="#d8b884" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="805" y="190" text-anchor="middle" fill="#b07d2e" font-size="13" font-weight="600">FRONTDESK</text>
  <rect x="690" y="202" width="230" height="34" rx="4" fill="#f6e2c2" stroke="#b07d2e" stroke-width="1"/>
  <text x="805" y="224" text-anchor="middle" fill="#7a531a" font-size="12">Inquiry Window (gRPC)</text>

  <rect x="675" y="258" width="260" height="358" rx="6" fill="#fef8ee" stroke="#d8b884" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="805" y="278" text-anchor="middle" fill="#b07d2e" font-size="13" font-weight="600">INQUIRY SPECIALISTS</text>

  <rect x="690" y="292" width="230" height="70" rx="4" fill="#f6e2c2" stroke="#b07d2e" stroke-width="1"/>
  <text x="805" y="313" text-anchor="middle" fill="#7a531a" font-size="13" font-weight="500">get_loan_by_id</text>
  <text x="805" y="333" text-anchor="middle" fill="#9a7330" font-size="11">reads: loans table</text>
  <text x="805" y="352" text-anchor="middle" fill="#5a6573" font-family="monospace" font-size="10">GET /api/loans/:id</text>

  <rect x="690" y="372" width="230" height="70" rx="4" fill="#f6e2c2" stroke="#b07d2e" stroke-width="1"/>
  <text x="805" y="393" text-anchor="middle" fill="#7a531a" font-size="13" font-weight="500">get_loans_by_borrower</text>
  <text x="805" y="413" text-anchor="middle" fill="#9a7330" font-size="11">reads: loans + index</text>
  <text x="805" y="432" text-anchor="middle" fill="#5a6573" font-family="monospace" font-size="10">GET /api/loans?borrower=</text>

  <rect x="690" y="452" width="230" height="70" rx="4" fill="#f6e2c2" stroke="#b07d2e" stroke-width="1"/>
  <text x="805" y="473" text-anchor="middle" fill="#7a531a" font-size="13" font-weight="500">get_overdue_loans_page</text>
  <text x="805" y="493" text-anchor="middle" fill="#9a7330" font-size="11">reads: overdue index</text>
  <text x="805" y="512" text-anchor="middle" fill="#5a6573" font-family="monospace" font-size="10">GET /api/loans/overdue</text>

  <rect x="715" y="544" width="180" height="32" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="805" y="565" text-anchor="middle" fill="#475569" font-size="12" font-weight="500">READ-ONLY</text>

  <!-- ===================== Flow arrows ===================== -->
  <line x1="195" y1="284" x2="195" y2="342" stroke="#3b6fb0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 310 438 Q 342 438 342 219 L 380 219" stroke="#7c5cd0" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>
  <line x1="500" y1="236" x2="500" y2="288" stroke="#3a8a4f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 615 334 L 685 334" stroke="#b07d2e" stroke-width="2" fill="none" marker-end="url(#arrowSlate)" stroke-dasharray="4,2"/>

  <!-- Legend -->
  <rect x="30" y="656" width="940" height="34" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="678" text-anchor="middle" fill="#475569" font-size="13">gRPC = external request   ·   Fact = event from another Division   ·   Event = internal stream slip   ·   filer = read-model projection</text>
</svg>
